<mat-card class="character">
  <button
    class="image-button"
    type="button"
    (click)="openImage()"
    [attr.aria-label]="'Ampliar imagen de ' + character.name"
  >
    @if (!failed) {
      <img [src]="character.image" [alt]="character.name" (error)="failed = true" />
    } @else {
      <span class="fallback">Imagen no disponible</span>
    }
  </button>
  <mat-card-content>
    <small>ID: {{ character.id }}</small>
    <h2>{{ character.name }}</h2>
    <a
      class="detail-link"
      [routerLink]="['/', character.universe, character.id]"
      [attr.aria-label]="'Ver detalle de ' + character.name"
    >
      Ver detalle
    </a>
  </mat-card-content>
</mat-card>
